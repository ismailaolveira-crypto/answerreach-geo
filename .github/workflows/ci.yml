name: quality-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --frozen
      - name: Lint API
        working-directory: apps/api
        run: uv run ruff check app scripts
      - name: Test API
        working-directory: apps/api
        run: PYTHONPATH=. uv run pytest -q
      - name: Audit Python dependencies
        working-directory: apps/api
        run: uv run pip-audit
      - name: Privacy audit
        run: python3 scripts/acceptance_privacy_audit.py

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: geo_platform
          POSTGRES_USER: geo_platform
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geo_platform -d geo_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://geo_platform:ci-postgres-password@127.0.0.1:5432/geo_platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install migration runtime
        working-directory: apps/api
        run: uv sync --frozen --no-dev
      - name: Migrate empty PostgreSQL database to head
        working-directory: apps/api
        run: uv run alembic upgrade head

  deployment-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate launchers and Compose contracts
        run: |
          set -euo pipefail
          python3 scripts/acceptance_architecture_audit.py
          bash -n scripts/geo-personal.sh
          bash -n scripts/geo-cloud.sh
          work_dir="$(mktemp -d)"
          trap 'find "$work_dir" -type f -delete; rmdir "$work_dir"' EXIT
          python3 apps/api/scripts/generate_deployment_config.py --mode personal --output "$work_dir/personal.env"
          python3 apps/api/scripts/generate_deployment_config.py --mode lan --host 192.168.1.20 --output "$work_dir/lan.env"
          python3 apps/api/scripts/generate_deployment_config.py --mode cloud --host geo.example.com --output "$work_dir/cloud.env"
          docker compose --env-file "$work_dir/personal.env" -f infra/docker-compose.personal.yml config --quiet
          docker compose --env-file "$work_dir/lan.env" -f infra/docker-compose.lan.yml config --quiet
          docker compose --env-file "$work_dir/cloud.env" -f infra/docker-compose.cloud.yml config --quiet
      - name: Validate reverse proxy configurations
        run: |
          docker run --rm --add-host api:127.0.0.1 --add-host web:127.0.0.1 \
            -v "$PWD/infra/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 nginx -t
          docker run --rm --add-host api:127.0.0.1 --add-host web:127.0.0.1 \
            -v "$PWD/infra/nginx.cloud.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 nginx -t
          docker run --rm --add-host gateway:127.0.0.1 -e GEO_DOMAIN=geo.example.com \
            -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d caddy validate --config /etc/caddy/Caddyfile

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org
      - name: Build Web
        run: pnpm run build:web
      - name: Type-check Web
        run: pnpm run check:web
      - name: Extension smoke
        run: node apps/geo-article-assistant-extension/tests/smoke.mjs

  browser:
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: sqlite:////tmp/geo-ci.db
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret
      INTERNAL_PROXY_SECRET: ci-only-proxy-secret-ci-only-proxy-secret
      PUBLIC_REGISTRATION_ENABLED: "true"
      AUTO_CREATE_TABLES: "false"
      CORS_ORIGINS: http://127.0.0.1:39003
      ALLOWED_HOSTS: 127.0.0.1,localhost
      INTERNAL_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_API_BASE_URL: ""
      GEO_LOCAL_HTTP: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install API and browser runtime
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run playwright install --with-deps chromium
      - name: Migrate isolated CI database
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: Build Web
        run: pnpm run build:web
      - name: Start isolated stack
        run: |
          uv --directory apps/api run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/geo-api-ci.log 2>&1 &
          pnpm --dir apps/web start --hostname 127.0.0.1 --port 39003 > /tmp/geo-web-ci.log 2>&1 &
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/health/ready >/dev/null && curl --fail --silent http://127.0.0.1:39003/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Real browser smoke without paid calls
        working-directory: apps/api
        run: PYTHONPATH=. uv run python ../../scripts/ci_browser_smoke.py
      - name: Show service diagnostics on failure
        if: failure()
        run: |
          tail -n 120 /tmp/geo-api-ci.log || true
          tail -n 120 /tmp/geo-web-ci.log || true

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build production images
        run: |
          docker build -f apps/api/Dockerfile -t geo-api:ci .
          docker build -f apps/web/Dockerfile -t geo-web:ci .
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: geo-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan Web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: geo-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
