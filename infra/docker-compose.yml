services:
  postgres:
    image: postgres:16
    container_name: geo-platform-postgres
    environment:
      POSTGRES_DB: geo_platform
      POSTGRES_USER: geo_platform
      POSTGRES_PASSWORD: geo_platform
    ports:
      - "5432:5432"
    volumes:
      - geo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_platform -d geo_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: geo-platform-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  geo_postgres_data:

