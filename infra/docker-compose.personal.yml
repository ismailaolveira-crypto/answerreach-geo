services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DEPLOYMENT_MODE: personal
      ENVIRONMENT: personal
      AUTO_CREATE_TABLES: "true"
      DATABASE_URL: sqlite:////data/geo_platform.db
      AUTH_SECRET: ${GEO_AUTH_SECRET:?Run generate_deployment_config.py first}
      CORS_ORIGINS: http://localhost:${GEO_HTTP_PORT:-3000}
    volumes:
      - geo_personal_data:/data
      - geo_personal_artifacts:/app/private_artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["uv", "run", "python", "scripts/run_worker.py", "--interval-seconds", "1", "--concurrency", "8"]
    environment:
      DEPLOYMENT_MODE: personal
      ENVIRONMENT: personal
      AUTO_CREATE_TABLES: "true"
      DATABASE_URL: sqlite:////data/geo_platform.db
      AUTH_SECRET: ${GEO_AUTH_SECRET:?Run generate_deployment_config.py first}
    volumes:
      - geo_personal_data:/data
      - geo_personal_artifacts:/app/private_artifacts
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    environment:
      INTERNAL_API_BASE_URL: http://api:8000
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${GEO_HTTP_PORT:-3000}:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  geo_personal_data:
  geo_personal_artifacts:
