services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: geo_platform
      POSTGRES_USER: geo_platform
      POSTGRES_PASSWORD: ${GEO_POSTGRES_PASSWORD:?Run generate_deployment_config.py first}
    volumes:
      - geo_lan_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_platform -d geo_platform"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["sh", "-c", "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --forwarded-allow-ips='*' --no-access-log"]
    environment:
      DEPLOYMENT_MODE: lan
      ENVIRONMENT: lan
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: postgresql+psycopg://geo_platform:${GEO_POSTGRES_PASSWORD}@postgres:5432/geo_platform
      AUTH_SECRET: ${GEO_AUTH_SECRET:?Run generate_deployment_config.py first}
      INTERNAL_PROXY_SECRET: ${GEO_INTERNAL_PROXY_SECRET:?Run generate_deployment_config.py first}
      PUBLIC_REGISTRATION_ENABLED: "false"
      CORS_ORIGINS: http://${GEO_LAN_HOST}:${GEO_HTTP_PORT:-3000}
      ALLOWED_HOSTS: api,localhost,127.0.0.1,${GEO_LAN_HOST}
    volumes:
      - geo_lan_artifacts:/app/private_artifacts
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["uv", "run", "--no-sync", "python", "scripts/run_worker.py", "--interval-seconds", "1", "--concurrency", "${GEO_WORKER_CONCURRENCY:-125}"]
    environment:
      DEPLOYMENT_MODE: lan
      ENVIRONMENT: lan
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: postgresql+psycopg://geo_platform:${GEO_POSTGRES_PASSWORD}@postgres:5432/geo_platform
      AUTH_SECRET: ${GEO_AUTH_SECRET:?Run generate_deployment_config.py first}
      PUBLIC_REGISTRATION_ENABLED: "false"
    volumes:
      - geo_lan_artifacts:/app/private_artifacts
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    environment:
      INTERNAL_API_BASE_URL: http://api:8000
      INTERNAL_PROXY_SECRET: ${GEO_INTERNAL_PROXY_SECRET:?Run generate_deployment_config.py first}
      GEO_LOCAL_HTTP: "true"
      GEO_PUBLIC_REGISTRATION_ENABLED: "false"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "0.0.0.0:${GEO_HTTP_PORT:-3000}:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  geo_lan_postgres:
  geo_lan_artifacts:
